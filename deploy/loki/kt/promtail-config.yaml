server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /promtail/positions.yaml

clients:
  - url: https://${LOKI_DOMAIN}/loki/api/v1/push
    basic_auth:
      username: ${LOKI_USER}
      password: ${LOKI_PASSWORD}
    backoff_config:
      min_period: 1s
      max_period: 5m
      max_retries: 20

scrape_configs:
  - job_name: digital-book
    static_configs:
      - targets: [localhost]
        labels:
          app: digital-book
          host: kt
          __path__: /logs/*.log
          __path_exclude__: /logs/*-error-*.log
    pipeline_stages:
      - json:
          expressions:
            service: service
            level: level
            ts: timestamp
      - labels:
          service:
          level:
      - timestamp:
          source: ts
          format: RFC3339Nano
