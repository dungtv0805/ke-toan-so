  # ============================================
  # All Services in Single Container
  # ============================================
  app:
    build:
      context: ..
      dockerfile: .docker/dockerfiles/Dockerfile.all
    container_name: digital-book-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "3004:3004"
      - "3005:3005"
      - "3006:3006"
      - "3007:3007"
    env_file:
      - ./env/db.env
      - ./env/jwt.env
      - ./env/services.env
    networks:
      - digital-book-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  digital-book-network:
    driver: bridge

