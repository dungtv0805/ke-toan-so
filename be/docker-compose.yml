version: '3.8'

services:
  app:
    image: localhost/digital-book:latest
    container_name: digital-book-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./env/db.env
      - ./env/jwt.env
      - ./env/services.env
    networks:
      - digital-book-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./dist:/app

networks:
  digital-book-network:
    external: true
